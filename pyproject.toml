[project]
name = "mirrordash-now-playing-spotify"
version = "1.0.0"
description = "What's playing on your Spotify right now"
requires-python = ">=3.14"
license = "MIT"  # LICENSE: yours to change; the template it came from asks nothing (MIT-0)
license-files = ["LICENSE"]
authors = [
    { name = "Menturan" }
]
# The mirror provides the rest (rendering, fetch_json/fetch, translations, fastapi); add only what else
# plugin.py imports
dependencies = [
    "segno~=1.6.6",
]

[project.entry-points."mirrordash.modules"]
mirrordash_now_playing_spotify = "mirrordash_now_playing_spotify.plugin:NowPlayingSpotifyModule"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.115",  # the mirror's, for the tests of a module with its own web address
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirrordash_now_playing_spotify"]
